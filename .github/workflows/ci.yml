name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only checks out and builds — the GITHUB_TOKEN never needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rusqlite links the system SQLite. libzmq needs no package: zmq-sys
      # compiles it from source and links it statically.
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release

  msrv:
    # rust-version in Cargo.toml is a promise; build on exactly that toolchain
    # so a dependency bump that raises it fails here instead of on a user's
    # machine. Keep the version below in step with Cargo.toml.
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.90

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets
