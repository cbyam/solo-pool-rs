name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Run JS actions on Node 24 ahead of GitHub's 2026-06-16 forced default, so
  # any incompatibility surfaces here instead of on a release day.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # tmq → zmq → libzmq: required to build and link.
      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all

      - name: Build (release)
        run: cargo build --release
