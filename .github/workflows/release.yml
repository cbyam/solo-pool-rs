name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag -a v0.3.0 -m "v0.3.0" && git push origin v0.3.0
# This builds Linux x86_64 and aarch64 binaries (each on a native runner),
# attaches them to a GitHub Release, and generates release notes from the
# commits since the previous tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # rusqlite links the system SQLite. libzmq needs no package: zmq-sys
      # compiles it from source and links it statically.
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          install -Dm755 target/release/solo-pool-rs dist/solo-pool-rs
          install -Dm644 config.toml.example dist/config.toml.example
          install -Dm644 README.md dist/README.md
          tar -C dist -czf "solo-pool-rs-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: solo-pool-rs-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true

      # The image is tagged without the v: v0.6.7 -> ghcr.io/...:0.6.7.
      - name: Image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: solo-pool-rs-*.tar.gz
          generate_release_notes: true
          # A tag with a SemVer pre-release suffix (v1.0.0-rc.1) publishes a
          # pre-release, so it is not shown as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## solo-pool-rs ${{ github.ref_name }}

            ### Install

            **Docker (recommended)** — no system dependencies, multi-arch
            (amd64 + arm64):
            ```bash
            docker pull ghcr.io/cbyam/solo-pool-rs:${{ env.IMAGE_TAG }}
            ```

            **Binary** — the attached tarballs are dynamically linked Linux
            builds (x86_64 and aarch64). They need the system SQLite and C++
            runtime on the host (`apt-get install libsqlite3-0 libstdc++6`,
            present on most distributions). libzmq is compiled in.
