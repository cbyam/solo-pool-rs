# Keep Cargo and Actions dependencies moving in small steps so a major-version
# bump is one reviewable PR rather than a forced big-bang upgrade at the next
# advisory. Advisories themselves are still caught daily by security.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Room for a crate family's worth of majors plus the grouped PR. At 5, the
    # five single-crate SV2 bumps of 2026-09-21 held the whole limit and no
    # other Cargo update could be proposed until they were closed.
    open-pull-requests-limit: 10
    groups:
      # The metrics crates pin each other's minors (the exporter depends on
      # the same metrics-util minor the pool imports for MetricKindMask), so
      # a bump to any one of them alone cannot compile. Move them together.
      metrics-stack:
        patterns: ["metrics", "metrics-*"]
      # The SRI Stratum V2 crates are released as a matched set: each new
      # major of mining_sv2/common_messages_sv2/framing_sv2/codec_sv2 requires
      # the matching binary_sv2 major, so bumping one alone cannot compile.
      # Move them together.
      sv2-stack:
        patterns: ["*_sv2"]
      # Patch and minor bumps are lockfile-only and land together.
      #
      # The exclusions are what make the two groups above work. A dependency
      # matching several groups is assigned to the one Dependabot scores most
      # specific, and this pattern-less group outranks wildcard patterns: its
      # job log showed every *_sv2 crate, metrics-util and
      # metrics-exporter-prometheus "belongs to more specific group
      # 'minor-and-patch'", leaving sv2-stack empty. A major bump then fell
      # out of every group and got its own PR (#118-#122, #126), and a
      # metrics-stack PR could only ever hold `metrics` (#98, which split the
      # stack and emptied /metrics). Excluded here, each family matches one
      # group only, so its minor, patch and major bumps arrive as one PR.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["*_sv2", "metrics", "metrics-*"]
    # Other majors stay one PR each so a breaking API change is reviewed alone.
    ignore:
      # secp256k1 is pinned by the SRI crates (noise_sv2, key-utils). Bumping
      # it alone yields two copies and a type mismatch in the Noise handshake.
      # SRI v1.12.0 is still on 0.28; drop this once SRI is on 0.29+.
      - dependency-name: secp256k1
        update-types: ["version-update:semver-minor"]
      # rand is held for the same reason: secp256k1 0.28, noise_sv2 and
      # key-utils all take rand 0.8's RNG traits, and the authority key is
      # generated with rand::thread_rng(), so 0.9 does not compile (#108,
      # #125). It moves when secp256k1 does; drop both entries together.
      - dependency-name: rand
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  # The Dockerfile pins its base images by digest. This moves the pins when
  # Debian or the Rust image publishes a new build, so OS security fixes in the
  # runtime image reach :edge on merge instead of waiting for the next release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
