# cargo-audit configuration.
#
# Kept in step with deny.toml: the two tools do not share config, so an
# exception recorded in one and not the other means CI disagrees with itself.
# If you drop an entry here, drop it there too.

[advisories]
ignore = [
  # C SQLite CVE-2026-119375 via libsqlite3-sys.
  #
  # The advisory flags the SQLite source that libsqlite3-sys bundles under its
  # `bundled` feature. This build does not enable it: rusqlite links the system
  # SQLite through pkg-config (CI, release, Docker), so that copy is never
  # compiled in.
  #
  # The system SQLite has the same bug. As of 2026-11-09 Debian trixie (the
  # Docker base) is marked vulnerable with no DSA planned, and Ubuntu noble has
  # no fix. It is still not reachable here: the bug needs a crafted database
  # and -wal pair, and the pool opens only its own stats database. Planting
  # one takes write access to the pool's data directory, which already gives
  # an attacker the config, the RPC cookie, and the payout address.
  #
  # Drop this entry once the linked SQLite is 3.54.0 or later, either through
  # distro updates or by building with rusqlite's `bundled` feature on 0.41+
  # (libsqlite3-sys 0.39, SQLite 3.54). Planned post-1.0.
  "RUSTSEC-2026-0459",
]
